<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13th M&amp;E Network Forum — Resource Person Confirmation</title>
    <meta http-equiv="Refresh" content="5; url=https://docs.google.com/forms/d/e/1FAIpQLSflAhrccdPL-g0J-6Cce3T28RL3v5VIdXhvPeNaWc_6VPd4GA/viewform?usp=header">
    <style>
        :root { --blue: #0a57a3; --ink: #333; --glass: rgba(255,255,255,.78); }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: linear-gradient(135deg, #d9edff, #f6d8e7 55%, #ffe1a8); }
        .card { width: min(520px, 100%); padding: 44px 36px; text-align: center; background: var(--glass); border: 1px solid rgba(255,255,255,.65); border-radius: 16px; box-shadow: 0 14px 40px rgba(20,35,60,.2); backdrop-filter: blur(18px); }
        .spinner { width: 44px; height: 44px; margin: 0 auto 20px; border: 5px solid rgba(10,87,163,.16); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        h1 { margin: 0 0 10px; font-size: clamp(22px, 4vw, 30px); }
        p { margin: 0 0 22px; line-height: 1.55; }
        a { display: inline-block; padding: 11px 20px; color: #fff; background: var(--blue); border-radius: 7px; text-decoration: none; font-weight: 600; }
        a:hover { background: #084782; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        window.setTimeout(function () {
            window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSflAhrccdPL-g0J-6Cce3T28RL3v5VIdXhvPeNaWc_6VPd4GA/viewform?usp=header");
        }, 250);
    </script>
</head>
<body>
    <main class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Opening resource-person confirmation</h1>
        <p>If you are not redirected automatically, use the button below.</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSflAhrccdPL-g0J-6Cce3T28RL3v5VIdXhvPeNaWc_6VPd4GA/viewform?usp=header">Open confirmation form</a>
    </main>
</body>
</html>
