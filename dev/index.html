002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notesOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px;\">\n          <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <article class=\"brandcard\" style=\"padding: 24px 22px 22px; background: #ffffff;\">\n              \n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\">\n                <span class=\"tag tag-accent\">{{ n.kind }}<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">{{ n.time }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3>{{ n.title }}<\u002Fh3>\n              <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 8px;\">Rapporteur's synthesis<\u002Fdiv>\n              <ul style=\"margin: 0 0 16px; padding-left: 18px; font-size: 13.5px; line-height: 1.6; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">\n                <sc-for list=\"{{ n.takeaways }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <li style=\"margin-bottom: 5px;\">{{ t }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; border-top: 1px solid var(--color-divider);\">\n                <sc-for list=\"{{ n.files }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <button class=\"btn btn-secondary\" type=\"button\" disabled>{{ f }} · coming soon<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"qa\" class=\"qa-section\">\n    <div class=\"section-shell\">\n      <div style=\"display: flex; align-items: flex-end; gap: 20px; margin-bottom: 10px;\">\n        <h2 style=\"margin: 0; font-size: 38px;\">Ask a question<\u002Fh2>\n        <span style=\"font-size: 13px; padding-bottom: 6px; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Powered by Slido · one event, five rooms<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.6; max-width: 80ch; margin: 0 0 24px; color: color-mix(in srgb, var(--color-text) 75%, transparent);\">One code for the whole day — <strong>#MNE13<\u002Fstrong>. Pick your room and the board follows you: plenary questions go to the plenary moderator, breakout questions to the breakout moderator. Nothing to install, no account, works on any phone.<\u002Fp>\n\n      <div class=\"filter-group\" role=\"group\" aria-label=\"Select Q&A room\">\n        <sc-for list=\"{{ rooms }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <button class=\"filter-chip {{ r.cls }}\" type=\"button\" aria-pressed=\"{{ r.pressed }}\" sc-camel-on-click=\"{{ r.select }}\">{{ r.short }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div class=\"qa-layout\">\n        <div>\n          <div class=\"brandcard\" style=\"padding: 24px 22px;\">\n            \n            <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Join this room<\u002Fdiv>\n            <div style=\"display: flex; gap: 20px; align-items: center;\">\n              <div style=\"flex: 1;\">\n                <div style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1; letter-spacing: 0.02em;\">#MNE13<\u002Fdiv>\n                <div style=\"font-size: 13px; margin-top: 6px; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">at <strong>slido.com<\u002Fstrong> → room <strong>{{ activeRoomShort }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width: 96px; height: 96px; flex: none; display: grid; place-items: center; border: 1px dashed color-mix(in srgb, var(--color-accent) 55%, transparent); background: var(--color-accent-100); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); text-align: center; line-height: 1.4;\">QR<br>per room<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; margin-top: 18px;\">\n              <a class=\"btn btn-primary\" href=\"https://app.sli.do\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration: none;\">Open in Slido <span class=\"sr-only\">(opens in a new tab)<\u002Fspan><\u002Fa>\n              <a class=\"btn btn-secondary\" href=\"https://app.sli.do\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration: none;\">Poll results <span class=\"sr-only\">(opens in a new tab)<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"brandcard\" style=\"margin-top: 20px; padding: 18px 20px;\">\n            \n            <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">How it runs<\u002Fdiv>\n            <ul style=\"margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.65; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">\n              <li>Seat cards and room signage carry the room's QR.<\u002Fli>\n              <li>Moderators run the queue from the top on the lectern screen.<\u002Fli>\n              <li>Secretariat exports the transcript at close of session.<\u002Fli>\n              <li>Unanswered questions get written replies in the notes.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"brandcard\" style=\"padding: 0; background: #ffffff; overflow: hidden;\">\n          \n          <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"width: 7px; height: 7px; background: {{ mirrorDot }};\"><\u002Fspan>\n            <span style=\"font-family: var(--font-heading); font-size: 15px;\">{{ activeRoomLabel }}<\u002Fspan>\n            <span class=\"tag tag-neutral\">{{ mirrorState }}<\u002Fspan>\n            <span style=\"margin-left: auto; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent);\">Slido embed · read-only mirror<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 6px 18px 18px;\">\n            <sc-if value=\"{{ mirrorEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"qa-empty\" role=\"status\">Live room questions will appear here when the Slido event opens. No questions are being simulated on this preview.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ mirror }}\" as=\"q\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 15px 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 9%, transparent); align-items: start;\">\n                <div style=\"border: 1px solid var(--color-divider); text-align: center; padding: 5px 0;\">\n                  <div style=\"font-size: 12px; line-height: 1;\">▲<\u002Fdiv>\n                  <div style=\"font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums;\">{{ q.votes }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin: 0 0 7px; font-size: 14.5px; line-height: 1.5;\">{{ q.text }}<\u002Fp>\n                  <div style=\"display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">\n                    <span>{{ q.author }}<\u002Fspan><span>·<\u002Fspan><span>{{ q.when }}<\u002Fspan>\n                    <span class=\"{{ q.statusCls }}\">{{ q.status }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ q.hasAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top: 10px; padding: 12px 14px; border-left: 2px solid var(--color-accent); background: var(--color-accent-100);\">\n                      <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 5px;\">{{ q.answerBy }}<\u002Fdiv>\n                      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55;\">{{ q.answer }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin: 14px 0 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">{{ mirrorFoot }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"gallery\" class=\"gallery-section\">\n    <div class=\"section-shell\">\n      <div style=\"display: flex; align-items: flex-end; gap: 20px; margin-bottom: 8px;\">\n        <h2 style=\"margin: 0; font-size: 38px;\">Regional M&amp;E Knowledge Gallery<\u002Fh2>\n        <span style=\"font-size: 13px; padding-bottom: 6px; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">{{ galleryStatus }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.6; max-width: 80ch; margin: 0 0 22px; color: color-mix(in srgb, var(--color-text) 75%, transparent);\">Completed evaluations from DEPDev Regional Offices, shown as printed posters at the venue. Voting happens on the printed posters during the Evaluation Gallery Walk. The Secretariat will publish the official gallery and tally after the Forum; the site never collects a vote.<\u002Fp>\n\n      <div class=\"brandcard\" style=\"padding: 14px 18px; margin-bottom: 26px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: #ffffff;\">\n        \n        <span style=\"width: 7px; height: 7px; background: {{ tallyDot }};\"><\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: 15px;\">{{ tallyHeadline }}<\u002Fspan>\n        <span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent);\">{{ tallySub }}<\u002Fspan>\n        <span style=\"margin-left: auto; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent);\">{{ tallySource }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"gallery-grid\">\n        <sc-for list=\"{{ posters }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <article class=\"brandcard\" style=\"padding: 20px; background: {{ p.bg }};\">\n            \n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\">\n              <span class=\"tag tag-outline\">{{ p.region }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: color-mix(in srgb, var(--color-text) 50%, transparent);\">Booth {{ p.booth }}<\u002Fspan>\n              <sc-if value=\"{{ p.showCount }}\" hint-placeholder-val=\"{{ true }}\">\n                <span class=\"{{ p.rankCls }}\" style=\"margin-left: auto;\">{{ p.rank }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <h3>{{ p.title }}<\u002Fh3>\n            <p style=\"margin: 0 0 16px; font-size: 12.5px; line-height: 1.5; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">{{ p.blurb }}<\u002Fp>\n            <sc-if value=\"{{ p.showCount }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;\">\n                  <span style=\"font-family: var(--font-heading); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums;\">{{ p.count }}<\u002Fspan>\n                  <span style=\"font-size: 11.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">stickers · {{ p.share }} of the room<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 4px; background: var(--color-neutral-200);\">\n                  <div style=\"height: 100%; background: var(--color-accent); width: {{ p.share }};\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ p.hideCount }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 12.5px; padding-top: 12px; border-top: 1px solid var(--color-divider); color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Tally posts after the gallery walk closes.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Farticle>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ postersEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"gallery-empty\" role=\"status\">Official evaluation gallery entries and the People’s Choice tally will be posted by the Secretariat after the Gallery Walk.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 24px;\">\n        <sc-for list=\"{{ tallyHow }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <div class=\"brandcard\" style=\"padding: 18px 20px;\">\n            \n            <div style=\"font-family: var(--font-heading); font-size: 26px; line-height: 1; color: var(--color-accent-400); margin-bottom: 8px;\">{{ h.no }}<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-size: 17px; margin-bottom: 6px;\">{{ h.title }}<\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12.5px; line-height: 1.55; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">{{ h.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <\u002Fmain>\n  <footer class=\"site-footer\">\n    <div class=\"halftone-y\" aria-hidden=\"true\" style=\"position: absolute; top: -30px; right: 40px; width: 260px; height: 200px; opacity: .35; pointer-events: none; -webkit-mask-image: radial-gradient(ellipse at 60% 40%, #000 25%, transparent 70%); mask-image: radial-gradient(ellipse at 60% 40%, #000 25%, transparent 70%);\"><\u002Fdiv>\n    <div class=\"sec-inner\" style=\"max-width: 1180px; margin: 0 auto; padding: 46px 24px 34px; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 40px;\">\n      <div>\n        <div style=\"font-family: var(--font-heading); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -0.02em;\"><span style=\"color: #b73e57;\">M<\u002Fspan><span style=\"color: #f1a81e;\">E<\u002Fspan>TAMORPHOSIS<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 12px; letter-spacing: 0.11em; margin-top: 9px; opacity: .9; white-space: nowrap;\">13<span style=\"font-size: .68em; vertical-align: super; letter-spacing: 0.06em;\">TH<\u002Fspan> M&amp;E NETWORK FORUM &nbsp;·&nbsp; SEPT 9, 2026<\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 13px; line-height: 1.6; max-width: 44ch; opacity: .9;\">Convened since 2011 by the Department of Economy, Planning, and Development. Funded under the DEPDev–UNDP Strategic Monitoring and Evaluation Project.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .84; margin-bottom: 12px;\">This site<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 7px; font-size: 13.5px;\">\n          <a href=\"#program\" style=\"color: inherit; text-decoration: none; opacity: .85;\">Program<\u002Fa>\n          <a href=\"#speakers\" style=\"color: inherit; text-decoration: none; opacity: .85;\">Resource persons<\u002Fa>\n          <a href=\"#notes\" style=\"color: inherit; text-decoration: none; opacity: .85;\">Notes &amp; materials<\u002Fa>\n          <a href=\"#gallery\" style=\"color: inherit; text-decoration: none; opacity: .85;\">Knowledge Gallery<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .84; margin-bottom: 12px;\">Secretariat<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; opacity: .85;\">Strategic Outcome Evaluation Division<br><a href=\"mailto:mes-soed@depdev.gov.ph\" style=\"color: inherit;\">mes-soed@depdev.gov.ph<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec-inner\" style=\"max-width: 1180px; margin: 0 auto; padding: 0 24px 30px;\">\n      <div style=\"display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding-top: 26px; border-top: 1px solid color-mix(in srgb, #ffffff 16%, transparent);\">\n        <span style=\"font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .84;\">Convened by<\u002Fspan>\n        <img loading=\"lazy\" decoding=\"async\" src=\"33b97d14-65ec-4339-a719-bb6c8b0b7166\" alt=\"Department of Economy, Planning, and Development\" style=\"height: 54px; width: auto; opacity: .9;\">\n        <img loading=\"lazy\" decoding=\"async\" src=\"1cdb3ddb-492a-4da8-a30c-3167de126d8a\" alt=\"M&amp;E Network Philippines\" style=\"height: 42px; width: auto; opacity: .9;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; opacity: .8;\">UNDP<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 1px solid color-mix(in srgb, #ffffff 18%, transparent);\">\n      <div style=\"max-width: 1180px; margin: 0 auto; padding: 14px 24px; font-size: 11.5px; opacity: .84; display: flex; gap: 18px;\">\n        <span>© 2026 DEPDev<\u002Fspan><span>Program indicative and subject to change<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;initialPhase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;before&quot;,&quot;live&quot;,&quot;after&quot;],&quot;default&quot;:&quot;before&quot;,&quot;tsType&quot;:&quot;'before'|'live'|'after'&quot;,&quot;section&quot;:&quot;Event phase&quot;}}\">\nconst SUBTHEMES = [\n  { no: \"01\", color: \"#4498d3\", title: \"AI-Enabled M&E Systems and International Practices\", body: \"How development partners, international organizations, and other governments use AI in M&E — and the policy, governance, institutional, and capability lessons relevant to Philippine public agencies.\" },\n  { no: \"02\", color: \"#0a57a3\", title: \"AI in Government Monitoring\", body: \"Philippine use cases in field data collection, automated processing, analysis, visualization, and timely reporting that support program and project decisions.\" },\n  { no: \"03\", color: \"#f1a81e\", title: \"AI in Evaluation\", body: \"Current and emerging applications across the evaluation cycle, including data collection, qualitative coding, evidence synthesis, causal analysis, impact estimation, and communication of findings.\" },\n  { no: \"04\", color: \"#b73e57\", title: \"Responsible Use of AI in M&E\", body: \"Governance, ethics, data privacy, transparency, accountability, human review, algorithmic bias, reliability, and safeguards that keep public evidence trustworthy.\" }\n];\n\nconst PROGRAM = [\n  { time: \"7:30\", title: \"Registration\", tag: \"Logistics\", kind: \"plain\" },\n  { time: \"8:00\", title: \"Opening Session\", tag: \"Ceremony\", kind: \"plain\" },\n  { time: \"8:10\", title: \"National Anthem\", tag: \"Ceremony\", kind: \"plain\" },\n  { time: \"8:15\", title: \"Keynote Message\", tag: \"Keynote\", kind: \"session\",\n    desc: \"The keynote message sets the national direction for the responsible use of artificial intelligence in public sector monitoring and evaluation.\" },\n  { time: \"8:35\", title: \"Overview of the 13th M&E Network Forum, House Rules, and Photo Opportunity\", tag: \"Ceremony\", kind: \"plain\" },\n  { time: \"8:45\", title: \"Plenary 1 — Setting the Chrysalis: AI Readiness and Evidence Gaps in the Public Sector\", tag: \"Plenary\", kind: \"session\",\n    desc: \"International and regional experience in using AI for data collection, evidence synthesis, and program monitoring will be discussed alongside the policy, governance, institutional, and capability gaps relevant to Philippine government agencies. Panel discussion and moderated Q&A.\" },\n  { time: \"10:15\", title: \"Morning Snack and Evaluation Gallery Walk\", tag: \"Break\", kind: \"plain\" },\n  { time: \"10:30\", title: \"Breakout 1 — Unpacking the Cocoon: Practical AI Use Cases in Public Sector Monitoring\", tag: \"Breakout\", kind: \"session\",\n    desc: \"Operational applications of AI in field data collection, automated processing, spatial analysis, visualization, and reporting across local, regional, and national government, with attention to data quality, privacy, reliability, maintenance, staff capability, and human review.\",\n    tracks: [\n      { room: \"Track A · Hall 1\", title: \"Signals from Antennae: Prototyping Naga City’s AI Planner to Collect Data on Transportation\", focus: \"Prototyping Naga City's AI planner: computer vision and automated capture to model municipal traffic, transit and urban infrastructure.\", people: [\"Dr. Syrus Gomari, Seermo\", \"Naga City Government\", \"Moderator: Regional Director Edna Cynthia S. Berces, DEPDev Regional Office V\"] },\n      { room: \"Track B · Hall 2\", title: \"A Data Path: Tracking Data on Environment, Mobility, and Tourism\", focus: \"Data analytics and sensor fusion tracking environmental impact, pedestrian mobility and tourism capacity in high-density ecosystems.\", people: [\"Baguio City Government\", \"Analytics and Data Science Lead, Asian Institute of Management (AIM)\", \"Moderator: Regional Director Apollo Edwin S. Pagano, DEPDev Regional Office Cordillera Administrative Region\"] },\n      { room: \"Track C · Hall 3\", title: \"Flying from Afar: Advanced Technologies for Monitoring\", focus: \"Earth observation, satellite imagery, computer vision and drone analytics for macro-monitoring of infrastructure, food security and agricultural assets.\", people: [\"Philippine Space Agency (PhilSA)\", \"Department of Agriculture, Bureau of Agricultural and Fisheries Engineering (DA-BAFE)\", \"Moderator: DEPDev Infrastructure Staff (IS)\"] }\n    ] },\n  { time: \"11:45\", title: \"Lunch Break\", tag: \"Break\", kind: \"plain\" },\n  { time: \"1:00\", title: \"Evaluation Dialogue Session\", tag: \"Dialogue\", kind: \"session\",\n    desc: \"An open-floor exchange between evaluators, commissioning agencies and users of evidence on what is and is not working in the national M&E ecosystem.\" },\n  { time: \"1:45\", title: \"Breakout 2 — Taking Shape: Emerging AI-Enabled Methodologies in Evaluation\", tag: \"Breakout\", kind: \"session\",\n    desc: \"Practical applications of AI across the evaluation cycle, including data collection, qualitative coding, evidence synthesis, causal analysis, impact estimation, and communication of findings, together with methodological validation, data protection, and human judgment.\",\n    tracks: [\n      { room: \"Track A · Hall 1\", title: \"Laying the Foundation: Processing Qualitative Evidence at Scale\", focus: \"Processing qualitative evidence at scale, and the safeguards qualitative data demands.\", people: [\"Dr. Erika Fille Legara, Education Center for AI Research, DepEd\", \"PIDS / UP CIDS\", \"Philippine Statistics Authority (PSA)\", \"Dr. Christopher Monterola, Asian Institute of Management\", \"Moderator: DEPDev Monitoring and Evaluation Staff\"] },\n      { room: \"Track B · Hall 2\", title: \"Unfolding the Wings: Enhancing Causal Inference and Impact Evaluation with Machine Learning\", focus: \"Enhancing causal inference and impact evaluation with machine learning.\", people: [\"Dr. Michael Ralph M. Abrigo, Senior Research Fellow, PIDS\", \"Dr. Karl Robert L. Jandoc, UP School of Economics\", \"Dr. Christopher James R. Cabuay, De La Salle University\", \"Undersecretary Joseph J. Capuno, DEPDev IPG\", \"Moderator: Dr. Josefina V. Almeda, Executive Director, PSRTI\"] },\n      { room: \"Track C · Hall 3\", title: \"Taking Flight: Generative AI for Rapid Evidence Synthesis and Communication\", focus: \"Generative AI and NLP for rapid evidence synthesis and policy translation.\", people: [\"UNDP\", \"ADB\", \"DEPDev Policy and Planning Group\", \"Congressional Policy and Budget Research Department (CPBRD)\", \"Senate Economic Planning Office (SEPO)\", \"Department of Budget and Management (DBM)\", \"Moderator: Dr. Aleli Kraft, Professor, UP School of Economics\"] }\n    ] },\n  { time: \"3:00\", title: \"Plenary 2 — Blooming Forward: Safeguarding Trust, Integrity, and Governance in AI-Enabled M&E\", tag: \"Plenary\", kind: \"session\",\n    desc: \"Public institutions need clear rules and safeguards for AI-supported M&E. This plenary will address transparency, privacy, fairness, accountability, reliable outputs, documentation, human review, algorithmic bias, and the conditions that enable decision-makers to trust AI-supported evidence.\" },\n  { time: \"4:00\", title: \"Forum Awards: People’s Choice Poster Award\", tag: \"Awards\", kind: \"plain\" },\n  { time: \"4:30\", title: \"Closing Message\", tag: \"Ceremony\", kind: \"plain\" },\n  { time: \"4:40\", title: \"Photo Opportunity, Final Reminders, and Same-Day Edit Video Presentation\", tag: \"Ceremony\", kind: \"plain\" },\n  { time: \"5:00\", title: \"Afternoon Snack and Socials\", tag: \"Break\", kind: \"plain\" }\n];\n\nconst SPEAKERS = [\n  { name: \"DEPDev Secretary\", org: \"Department of Economy, Planning, and Development\", role: \"Keynote\", session: \"Keynote Message\", group: \         this.setState({ mobileNavOpen: false }, this.restoreMobileFocus);\n        return;\n      }\n      if (event.key === \"Tab\") {\n        const nav = document.querySelector(\"#primary-navigation\");\n        const focusable = nav ? Array.from(nav.querySelectorAll(\"a, button, input, [tabindex]:not([tabindex='-1'])\")) : [];\n        if (!focusable.length) return;\n        const first = focusable[0];\n        const last = focusable[focusable.length - 1];\n        if (event.shiftKey && document.activeElement === first) {\n          event.preventDefault();\n          last.focus();\n        } else if (!event.shiftKey && document.activeElement === last) {\n          event.preventDefault();\n          first.focus();\n        }\n      }\n    };\n    this.onPointerDown = event => {\n      if (this.state.mobileNavOpen && !event.target.closest(\".site-header\")) {\n        this.setState({ mobileNavOpen: false }, () => document.body.classList.remove(\"nav-open\"));\n      }\n    };\n    window.addEventListener(\"keydown\", this.onKeyDown);\n    document.addEventListener(\"pointerdown\", this.onPointerDown);\n    if (\"IntersectionObserver\" in window) {\n      this.sectionObserver = new IntersectionObserver(entries => {\n        const visible = entries.filter(entry => entry.isIntersecting);\n        if (visible.length) this.setState({ activeSection: visible[visible.length - 1].target.id });\n      }, { rootMargin: \"-20% 0px -68% 0px\", threshold: 0 });\n      document.querySelectorAll(\"main section[id]\").forEach(section => this.sectionObserver.observe(section));\n      const richMotion = window.matchMedia(\"(min-width: 900px) and (hover: hover) and (prefers-reduced-motion: no-preference)\");\n      if (richMotion.matches) {\n        document.documentElement.classList.add(\"motion-enabled\");\n        this.revealObserver = new IntersectionObserver(entries => {\n          entries.forEach(entry => {\n            if (entry.isIntersecting) {\n              entry.target.classList.add(\"is-revealed\");\n              this.revealObserver.unobserve(entry.target);\n            }\n          });\n        }, { rootMargin: \"0px 0px -12% 0px\", threshold: 0.08 });\n        document.querySelectorAll(\"main section:not(.hero)\").forEach(section => this.revealObserver.observe(section));\n      }\n    }\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    window.removeEventListener(\"keydown\", this.onKeyDown);\n    document.removeEventListener(\"pointerdown\", this.onPointerDown);\n    document.body.classList.remove(\"nav-open\");\n    if (this.sectionObserver) this.sectionObserver.disconnect();\n    if (this.revealObserver) this.revealObserver.disconnect();\n  }\n\n  renderVals() {\n    const st = this.state;\n    const phase = st.phase;\n    const target = new Date(\"2026-09-09T07:30:00+08:00\").getTime();\n    const d = Math.max(0, target - st.now);\n    const pad = n => String(n).padStart(2, \"0\");\n    const countdown = [\n      { label: \"Days\", value: String(Math.floor(d / 86400000)) },\n      { label: \"Hours\", value: pad(Math.floor((d % 86400000) / 3600000)) },\n      { label: \"Minutes\", value: pad(Math.floor((d % 3600000) / 60000)) }\n    ];\n\n    const tagClassFor = t => {\n      if (t === \"Plenary\" || t === \"Keynote\") return \"tag tag-accent\";\n      if (t === \"Breakout\" || t === \"Dialogue\") return \"tag tag-outline\";\n      return \"tag tag-neutral\";\n    };\n\n    const program = PROGRAM.map((r, i) => {\n      const isSession = r.kind === \"session\";\n      const open = isSession && !!st.open[i];\n      return {\n        time: r.time, title: r.title, tag: r.tag, desc: r.desc || \"\",\n        tracks: r.tracks || [],\n        tagClass: tagClassFor(r.tag),\n        chev: isSession ? (open ? \"−\" : \"+\") : \"\",\n        interactive: isSession,\n        plain: !isSession,\n        panelId: \"program-panel-\" + i,\n        rowBg: open ? \"color-mix(in srgb, var(--color-accent) 6%, transparent)\" :   const postersEmpty = true;\n\n    return {\n      isBefore: phase === \"before\", isLive: phase === \"live\", isAfter: phase === \"after\",\n      previewMode: st.previewMode,\n      mobileNavOpen: st.mobileNavOpen,\n      mobileNavClass: st.mobileNavOpen ? \"primary-nav is-open\" : \"primary-nav\",\n      mobileMenuIcon: st.mobileNavOpen ? \"×\" : \"☰\",\n      mobileMenuLabel: st.mobileNavOpen ? \"Close navigation\" : \"Open navigation\",\n      navOverviewCurrent: st.activeSection === \"overview\" ? \"page\" : \"false\",\n      navProgramCurrent: st.activeSection === \"program\" ? \"page\" : \"false\",\n      navSpeakersCurrent: st.activeSection === \"speakers\" ? \"page\" : \"false\",\n      navNotesCurrent: st.activeSection === \"notes\" ? \"page\" : \"false\",\n      navQaCurrent: st.activeSection === \"qa\" ? \"page\" : \"false\",\n      navGalleryCurrent: st.activeSection === \"gallery\" ? \"page\" : \"false\",\n      toggleMobileNav: () => this.setState(s => ({ mobileNavOpen: !s.mobileNavOpen }), () => {\n        document.body.classList.toggle(\"nav-open\", this.state.mobileNavOpen);\n        if (this.state.mobileNavOpen) {\n          const first = document.querySelector(\"#primary-navigation a\");\n          if (first) first.focus();\n        } else {\n          const button = document.querySelector(\".mobile-menu-button\");\n          if (button) button.focus();\n        }\n      }),\n      closeMobileNav: () => this.setState({ mobileNavOpen: false }, () => document.body.classList.remove(\"nav-open\")),\n      countdownLabel: countdown.map(u => u.value + \" \" + u.label).join(\", \") + \" until the Forum\",\n      setBefore: () => this.setState({ phase: \"before\" }),\n      setLive: () => this.setState({ phase: \"live\" }),\n      setAfter: () => this.setState({ phase: \"after\" }),\n      countdown, subthemes: SUBTHEMES, program,\n      expandAll: () => this.setState(() => {\n        const o = {};\n        PROGRAM.forEach((r, i) => { if (r.kind === \"session\") o[i] = true; });\n        return { open: o };\n      }),\n      collapseAll: () => this.setState({ open: {} }),\n      speakerFilters, speakers,\n      notesLocked: phase !== \"after\",\n      notesOpen: phase === \"after\",\n      notesStatus: phase === \"after\" ? \"Materials pending Secretariat upload\" : \"Locked until the Forum\",\n      notes: NOTES,\n      rooms, activeRoomLabel: activeRoom.label, activeRoomShort: activeRoom.short,\n      mirror, mirrorEmpty, mirrorState, mirrorFoot,\n      mirrorDot: phase === \"live\" && activeRoom.live ? \"#f1a81e\" : \"var(--color-neutral-400)\",\n      posters, postersEmpty, tallyHow: TALLY_HOW,\n      tallyDot: phase === \"after\" ? \"var(--color-accent)\" : \"var(--color-neutral-400)\",\n      tallyHeadline: phase === \"after\" ? \"Official tally pending Secretariat upload\" : (phase === \"live\" ? \"Gallery Walk in progress\" : \"Voting opens at registration\"),\n      tallySub: phase === \"after\" ? \"The official gallery and tally will appear here when released.\" : \"Participants vote on printed evaluation posters during the Gallery Walk.\",\n      tallySource: phase === \"after\" ? \"Awaiting official upload\" : \"No online voting\",\n      galleryStatus: phase === \"after\" ? \"Official gallery pending Secretariat upload\" : \"Gallery details will be posted before the Forum\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
