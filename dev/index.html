      /* --- Metamorphosis identity carried through the scrolling page -----
         The hero owns the full animated transformation. Down-page sections
         reuse only the cropped butterfly and its amber-to-red trail, keeping
         the event identity present without repeating the wordmark/artboard. */
      main section:not(.hero) {
        position: relative;
        overflow: clip;
        isolation: isolate;
      }
      main section:not(.hero) > .section-shell {
        position: relative;
        z-index: 1;
      }
      main section:not(.hero)::before {
        content: "";
        position: absolute;
        z-index: 0;
        top: 0;
        left: 50%;
        width: min(1180px, calc(100% - 40px));
        height: 3px;
        transform: translateX(-50%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(72,152,211,.38) 18%,
          rgba(241,168,31,.72) 52%,
          rgba(195,67,93,.62) 82%,
          transparent
        );
      }
      .themes::after,
      #program::after,
      #speakers::after,
      #notes::after,
      #qa::after,
      #gallery::after {
        content: "";
        position: absolute;
        z-index: 0;
        width: clamp(120px, 14vw, 220px);
        aspect-ratio: 255 / 285;
        background: url("../assets/butterfly-mark.svg") center / contain no-repeat;
        opacity: .065;
        pointer-events: none;
      }
      .themes::after,
      #speakers::after,
      #qa::after {
        top: clamp(42px, 8vw, 96px);
        right: clamp(-88px, -5vw, -42px);
        transform: rotate(11deg);
      }
      #program::after,
      #notes::after,
      #gallery::after {
        bottom: clamp(34px, 7vw, 88px);
        left: clamp(-88px, -5vw, -42px);
        transform: scaleX(-1) rotate(8deg);
      }
      html[data-thinking-mode="ultra"] main section:not(.hero)::before {
        opacity: .72;
      }
      html[data-thinking-mode="ultra"] :is(
        .themes,
        #program,
        #speakers,
        #notes,
        #qa,
        #gallery
      )::after {
        opacity: .095;
      }
      html[data-thinking-mode="ultra"] :is(
        .theme-card,
        .brandcard
      ) .sc-interp,
      html[data-thinking-mode="ultra"] .theme-card .card-body {
        color: #b8cad7 !important;
      }
      @media (max-width: 880px) {
        main section:not(.hero)::before {
          width: calc(100% - 32px);
          height: 2px;
        }
        .themes::after,
        #program::after,
        #speakers::after,
        #notes::after,
        #qa::after,
        #gallery::after {
          width: clamp(76px, 22vw, 112px);
          opacity: .045;
        }
      }
      @media (max-width: 420px) {
        .themes::after,
        #program::after,
        #speakers::after,
        #notes::after,
        #qa::after,
        #gallery::after {
          display: block;
        }
      }

      /* --- Mobile background art ----------------------------------------
         The template's decorative path animation was desktop-only and the
         first mobile remediation pass then killed every hero animation. Keep
         the phone treatment lighter instead: two dashed paths and at most two
         edge-cropped marks, all on transform/opacity-friendly slow clocks. */
      @keyframes mobileHeroPathTravel {
        to { stroke-dashoffset: -80; }
      }
      @keyframes mobileHeroMarkOne {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(10deg); }
        50% { transform: translate3d(-7px, 10px, 0) rotate(14deg); }
      }
      @keyframes mobileHeroMarkTwo {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(-14deg); }
        50% { transform: translate3d(8px, -9px, 0) rotate(-9deg); }
      }
      @keyframes mobileButterflyFlight {
        0% { opacity: 0; transform: translate3d(-22vw, 0, 0) rotate(-5deg) scale(.82); }
        18% { opacity: .09; }
        72% { opacity: .07; }
        100% { opacity: 0; transform: translate3d(126vw, -16px, 0) rotate(4deg) scale(.96); }
      }
      @keyframes mobileSectionMarkRight {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(11deg); }
        50% { transform: translate3d(-5px, 8px, 0) rotate(14deg); }
      }
      @keyframes mobileSectionMarkLeft {
        0%, 100% { transform: translate3d(0, 0, 0) scaleX(-1) rotate(8deg); }
        50% { transform: translate3d(5px, -8px, 0) scaleX(-1) rotate(11deg); }
      }
      @keyframes mobileSectionTrail {
        0%, 100% { transform: translateX(-50%) scaleX(.92); }
        50% { transform: translateX(-50%) scaleX(1); }
      }
      @media (min-width: 320px) and (max-width: 880px) and (prefers-reduced-motion: no-preference) {
        .hero {
          isolation: isolate;
        }
        .hero > svg,
        .hero > img[aria-hidden="true"] {
          z-index: 0 !important;
          pointer-events: none;
        }
        .hero > svg path {
          vector-effect: non-scaling-stroke;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          .hero > svg path[stroke-dasharray] {
          animation: mobileHeroPathTravel 14s linear infinite !important;
        }
        .hero > img[aria-hidden="true"]:nth-of-type(1) {
          top: 15% !important;
          right: -54px !important;
          width: clamp(118px, 34vw, 178px) !important;
          opacity: .075 !important;
        }
        .hero > img[aria-hidden="true"]:nth-of-type(2) {
          bottom: 4% !important;
          left: -66px !important;
          width: clamp(138px, 39vw, 205px) !important;
          opacity: .07 !important;
        }
        .hero > img[aria-hidden="true"]:nth-of-type(3) {
          display: none !important;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          .hero > img[aria-hidden="true"]:nth-of-type(1) {
          animation: mobileHeroMarkOne 30s var(--ease-ambient) infinite !important;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          .hero > img[aria-hidden="true"]:nth-of-type(2) {
          animation: mobileHeroMarkTwo 38s var(--ease-ambient) infinite !important;
        }
        html[data-thinking-mode="ultra"] .ultra-butterfly-field {
          opacity: .46;
        }
        .ultra-butterfly-field > img {
          top: 72% !important;
          left: -24vw;
          width: clamp(88px, 25vw, 148px);
          animation: mobileButterflyFlight 32s linear infinite;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          main section:not(.hero)::before {
          animation: mobileSectionTrail 18s var(--ease-ambient) infinite;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          :is(.themes, #speakers, #qa)::after {
          animation: mobileSectionMarkRight 26s var(--ease-ambient) infinite;
        }
        html:is([data-thinking-mode="high"], [data-thinking-mode="ultra"])
          :is(#program, #notes, #gallery)::after {
          animation: mobileSectionMarkLeft 30s var(--ease-ambient) infinite;
        }
      }
      @media (max-width: 420px) {
        .themes::after,
        #program::after,
        #speakers::after,
        #notes::after,
        #qa::after,
        #gallery::after {
          width: clamp(58px, 18vw, 76px);
          opacity: .035;
        }
        html[data-thinking-mode="ultra"] :is(
          .themes,
          #program,
          #speakers,
          #notes,
          #qa,
          #gallery
        )::after {
          opacity: .055;
        }
      }
      @media (min-width: 320px) and (max-width: 880px) and (max-height: 500px) {
        .hero > img[aria-hidden="true"]:nth-of-type(1) {
          top: -34px !important;
          right: 5% !important;
          width: 118px !important;
          opacity: .055 !important;
        }
        .hero > img[aria-hidden="true"]:nth-of-type(2) {
          bottom: -64px !important;
          left: -24px !important;
          width: 138px !important;
          opacity: .05 !important;
        }
        .ultra-butterfly-field > img {
          top: 78% !important;
          width: 92px;
        }
      }
      html[data-thinking-mode="instant"] .hero > svg path,
      html[data-thinking-mode="instant"] .hero > img[aria-hidden="true"],
      html[data-thinking-mode="instant"] main section:not(.hero)::before,
      html[data-thinking-mode="instant"] .themes::after,
      html[data-thinking-mode="instant"] #program::after,
      html[data-thinking-mode="instant"] #speakers::after,
      html[data-thinking-mode="instant"] #notes::after,
      html[data-thinking-mode="instant"] #qa::after,
      html[data-thinking-mode="instant"] #gallery::after {
        animation: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .hero > svg path,
        main section:not(.hero)::before,
        .themes::after,
        #program::after,
        #speakers::after,
        #notes::after,
        #qa::after,
        #gallery::after {
          animation: none !important;
        }
      }

      /* --- Phone masthead ------------------------------------------------
         Reuse the one animated hero identity as the first portrait-phone row.
         The institutional header stays compact; the event mark now leads the
         hero above the date/location chips without cloning the artwork. */
      @media (max-width: 600px) and (min-height: 501px) {
        .site-brand > div {
          display: none !important;
        }
        .hero__inner {
          display: grid !important;
          grid-template-columns: minmax(0, 1fr) !important;
          gap: 0 !important;
          padding-top: clamp(14px, 4vw, 20px) !important;
        }
        .hero__content {
          grid-column: 1;
          grid-row: 2;
          min-width: 0;
        }
        .hero__art,
        html[data-thinking-mode="ultra"] .hero__art {
          grid-column: 1;
          grid-row: 1;
          order: -1;
          align-self: center;
          display: grid !important;
          grid-template-columns: minmax(0, 1fr) !important;
          width: min(82vw, 320px);
          max-width: 320px;
          min-height: 72px;
          margin: 0 auto clamp(16px, 4vw, 22px) !important;
          padding: 0;
        }
        .hero__art > img,
        .hero__identity-logo {
          width: 100% !important;
          max-height: clamp(116px, 34vw, 150px);
          margin: 0 auto !important;
          object-fit: contain;
        }
        html[data-thinking-mode="ultra"] .hero__transformation-logo {
          width: 100% !important;
          max-height: clamp(150px, 46vw, 190px);
          margin: 0 auto !important;
          object-fit: contain;
        }
        .hero__art > div {
          display: none !important;
        }
        html[data-thinking-mode="ultra"] .hero__art {
          width: min(100%, 360px);
          max-width: 360px;
          min-height: clamp(150px, 46vw, 190px);
        }
      }
      @media (max-width: 370px) and (min-height: 501px) {
        .hero__art,
        html[data-thinking-mode="ultra"] .hero__art {
          width: min(100%, 300px);
          max-width: 300px;
          min-height: clamp(145px, 48vw, 165px);
        }
        html[data-thinking-mode="ultra"] .hero__transformation-logo {
          max-height: clamp(145px, 48vw, 165px);
        }
      }

      html[data-thinking-mode="ultra"]:not([data-transformation-ready]) .hero__identity-logo {
        display: none !important;
      }
      html[data-thinking-mode="ultra"]:not([data-transformation-ready]) .hero__transformation-logo {
        display: none !important;
      }
      html[data-thinking-mode="ultra"][data-transformation-ready="true"] .hero__identity-logo {
        display: none !important;
      }
      /* Inlining fails whenever fetch() can't reach the asset — a file://
         preview (opaque origin), an offline reload, a mis-deployed assets
         folder. That is not a reason to drop back to the static identity:
         the <img> renders the same SVG and plays its 12s one-shot keyframes
         on the image's own clock. Ultra loses only the frame-accurate sync
         with the headline timeline, not the transformation itself. */
      html[data-thinking-mode="ultra"][data-transformation-ready="fallback"] .hero__identity-logo {
        display: none !important;
      }
      html[data-thinking-mode="ultra"][data-transformation-ready="fallback"] .hero__transformation-logo {
        display: block !important;
      }

      @media (prefers-reduced-motion: reduce) {
        html[data-thinking-mode="ultra"][data-transformation-ready="true"] .hero__transformation-logo {
          display: block !important;
        }
        /* An <img>-hosted SVG can't be paused from here, so the fallback is
           the one case where reduced motion has to keep the static mark. */
        html[data-thinking-mode="ultra"][data-transformation-ready="fallback"] .hero__transformation-logo {
          display: none !important;
        }
        html[data-thinking-mode="ultra"][data-transformation-ready="fallback"] .hero__identity-logo {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
        html[data-thinking-mode="ultra"] .hero__identity-logo {
          display: none !important;
        }
        html[data-thinking-mode="ultra"] .hero__art,
        html[data-thinking-mode="ultra"] .hero__art > img,
        html[data-thinking-mode="ultra"] .hero__art > svg {
          animation: none !important;
        }
        .ultra-butterfly-field {
          display: none !important;
        }
        .hero > img[aria-hidden="true"] {
          animation: none !important;
        }
      }

      /* ==================================================================
         Down-page pass — section rhythm, program spine, card discipline,
         motion choreography, and a footer that speaks the same language
         as the sections above it.

         Appended after the QA layer for the same reason that layer was
         appended after the base: everything here is a deliberate override
         of the bundled template, and keeping it in one block means the
         next person can read the intent instead of diffing specificity.
         ================================================================== */

      /* --- Local tokens ---------------------------------------------------
         Every new colour lands here first so Ultra only has to restate the
         handful of values below rather than shadow each component rule. */
      :root {
        --rule-accent: linear-gradient(90deg, var(--brand-yellow), #c3435d);
        --line-soft: rgba(10,87,163,.14);
        --line-mid: rgba(10,87,163,.3);
        --panel-surface: rgba(255,255,255,.58);
        --panel-surface-hover: #fff;
        --elev-1: 0 10px 28px rgba(4,23,55,.06);
        --elev-2: 0 18px 40px rgba(4,23,55,.12);
        --node-neutral: #b5a88f;
        --badge-tint: linear-gradient(140deg, #eef6ff, #e0ecfa);
        --chev-ink: var(--brand-blue-dark);
        --chev-ink-on: #fff;
        --chev-fill: var(--brand-blue-dark);
        --stat-ink: #1f6fa8;
        --label-ink: var(--brand-blue-dark);
        --footer-surface: linear-gradient(180deg, #0d5da8 0%, #084b8c 60%, #073d75 100%);
        --footer-label: #ffc65c;
        --footer-text: rgba(255,255,255,.86);
        --footer-line: rgba(255,255,255,.18);
        --footer-bar: rgba(0,0,0,.17);
      }
      html[data-thinking-mode="ultra"] {
        --line-soft: rgba(114,198,246,.18);
        --line-mid: rgba(114,198,246,.4);
        --panel-surface: rgba(11,30,46,.72);
        --panel-surface-hover: rgba(17,44,66,.94);
        --elev-1: 0 14px 34px rgba(0,0,0,.28);
        --elev-2: 0 20px 46px rgba(0,0,0,.42);
        --node-neutral: #5b7d94;
        --badge-tint: linear-gradient(140deg, rgba(72,152,211,.24), rgba(7,89,163,.16));
        --chev-ink: #cfe9f9;
        --chev-ink-on: #06202f;
        --chev-fill: #7fc2ea;
        --stat-ink: #8fc9ed;
        --label-ink: #8fc9ed;
        --footer-surface: linear-gradient(145deg, #04101a, #071d2d);
        --footer-label: #ffc24a;
        --footer-line: rgba(114,198,246,.2);
        --footer-bar: rgba(0,0,0,.3);
      }

      /* --- Motion 1: hand the reveal to JS -------------------------------
         The bundle faded in a whole <section> at a time, and only above
         900px with a hover-capable pointer, so a phone saw six slabs snap
         into place and a laptop saw one 560ms fade per screenful. Both
         states are neutralised here; initScrollChoreography() re-reveals
         the individual cards, rows and columns instead. The mode-specific
         selectors are restated so equal specificity lets these win. */
      main section:not(.hero) .section-shell,
      html.motion-enabled main section:not(.hero) .section-shell,
      html[data-thinking-mode="instant"].motion-enabled main section:not(.hero) .section-shell,
      html[data-thinking-mode="high"].motion-enabled main section:not(.hero) .section-shell,
      html[data-thinking-mode="ultra"].motion-enabled main section:not(.hero) .section-shell {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }

      /* --- Motion 2: hover lift moves to the translate property -----------
         The entrance animations own transform, and a filled entrance would
         otherwise sit permanently on top of a hover translateY. Using the
         standalone translate property lets the two compose. */
      @media (hover: hover) {
        .theme-card,
        .speaker-card,
        .track-card,
        .gallery-grid > .brandcard,
        .tally-method-grid > .brandcard {
          transition:
            translate var(--dur-3) var(--ease-emphasis),
            box-shadow var(--dur-3) var(--ease-standard),
            border-color var(--dur-3) var(--ease-standard);
        }
        .theme-card:hover,
        .speaker-card:hover,
        .track-card:hover,
        .gallery-grid > .brandcard:hover,
        .tally-method-grid > .brandcard:hover {
          transform: none !important;
          translate: 0 -4px;
          box-shadow: var(--elev-2);
          border-color: var(--line-mid) !important;
        }
        .filter-chip:hover:not([aria-pressed="true"]):not(.is-active) {
          border-color: var(--brand-blue-dark) !important;
          translate: 0 -1px;
        }
        .btn-primary:hover {
          translate: 0 -1px;
          box-shadow: 0 10px 22px rgba(10,87,163,.26);
        }
        .btn-secondary:hover {
          border-color: var(--brand-blue-dark) !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .theme-card:hover,
        .speaker-card:hover,
        .track-card:hover,
        .gallery-grid > .brandcard:hover,
        .tally-method-grid > .brandcard:hover,
        .filter-chip:hover,
        .btn-primary:hover {
          translate: none;
        }
      }

      /* --- Section headers: one pattern, six sections ---------------------
         Each heading was its own arrangement — Program at 38px with a
         separate hairline div beneath, Themes with a flex-filler rule,
         the rest with the template's 48px amber dash. They now share a
         full-width hairline carrying the amber-to-red accent segment
         already used for section boundaries and the footer seam. */
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"] {
        position: relative;
        flex-wrap: wrap;
        gap: 8px 20px !important;
        margin: 0 0 clamp(24px, 2.6vw, 34px) !important;
        padding-bottom: 18px;
      }
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"]::before {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 1px;
        background: var(--line-soft);
      }
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"]::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 64px;
        height: 3px;
        border-radius: 3px;
        background: var(--rule-accent);
      }
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"] > h2 {
        margin: 0 !important;
        font-size: clamp(28px, 3.2vw, 40px) !important;
        line-height: 1.08;
        letter-spacing: -.025em;
      }
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"] > span {
        padding-bottom: 3px !important;
        font-size: 13.5px !important;
        line-height: 1.45;
      }
      .program-heading__actions {
        padding-bottom: 0 !important;
        align-self: flex-end;
      }
      /* The header rule replaces both the template's dash and the two
         standalone divider divs it used to need. */
      main section:not(.hero) h2::after,
      main section:not(.hero) .eyebrow-heading::after {
        display: none !important;
      }
      main section:not(.hero) .section-shell > div[style*="height: 1px"],
      main section:not(.hero) .section-shell > div[style*="align-items: flex-end"] > div[style*="height: 1px"] {
        display: none !important;
      }
      /* Themes opens on an eyebrow rather than a display heading — the four
         cards are the content, so it stays an eyebrow. Its filler rule
         takes the amber-to-red accent instead of flat grey, which is what
         relates it to the five headers below. */
      .themes .section-shell > div:first-child {
        margin-bottom: clamp(24px, 2.6vw, 34px) !important;
      }
      .themes .section-shell > div:first-child > div {
        height: 3px !important;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--brand-yellow), #c3435d 26%, transparent 88%) !important;
      }
      .themes .eyebrow-heading {
        letter-spacing: .18em;
      }
      /* Boundary rule now tracks the fluid shell instead of a fixed 1180. */
      main section:not(.hero)::before {
        width: min(var(--shell), calc(100% - 40px));
      }

      /* --- Program: an agenda with a spine --------------------------------
         24 rows of time / title / tag read as an undifferentiated ledger.
         A timeline rail down the gutter between the time and the title
         gives the list a shape, and the node colour states each row's
         kind so Plenary, Breakout and Logistics separate at a glance. */
      #program .section-shell > .program-item {
        position: relative;
        --row-accent: var(--line-mid);
        background: var(--panel-surface);
        border-left: 1px solid var(--line-soft);
        border-right: 1px solid var(--line-soft);
        border-bottom: 1px solid var(--line-soft) !important;
        transition: background var(--dur-2) var(--ease-standard);
      }
      #program .section-shell > .program-item:first-of-type {
        border-top: 1px solid var(--line-soft);
        border-radius: 18px 18px 0 0;
      }
      #program .section-shell > .program-item:last-of-type {
        border-radius: 0 0 18px 18px;
      }
      #program .section-shell > .program-item:has(.tag-accent) {
        --row-accent: var(--brand-blue-mid);
      }
      #program .section-shell > .program-item:has(.tag-outline) {
        --row-accent: #c3435d;
      }
      #program .section-shell > .program-item:has(.tag-neutral) {
        --row-accent: var(--node-neutral);
      }
      #program .section-shell .program-row {
        position: relative;
        grid-template-columns: 74px minmax(0, 1fr) auto !important;
        gap: 34px !important;
        min-height: 68px;
        padding: 15px 18px 15px 4px !important;
      }
      .program-row__time {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Rail: drawn on the item so it spans an expanded panel too, and
         stopped half a row short at each end so it reads as a segment
         rather than an overshoot. */
      #program .section-shell > .program-item::before {
        content: "";
        position: absolute;
        left: 95px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line-soft);
      }
      #program .section-shell > .program-item:first-of-type::before {
        top: 34px;
      }
      #program .section-shell > .program-item:last-of-type::before {
        bottom: calc(100% - 34px);
      }
      #program .section-shell .program-row::after {
        content: "";
        position: absolute;
        left: 95px;
        top: 34px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        translate: -50% -50%;
        background: var(--page-bg);
        border: 2px solid var(--row-accent);
        transition: scale var(--dur-2) var(--ease-emphasis);
      }
      #program .section-shell button.program-row::after {
        background: var(--row-accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--row-accent) 16%, transparent);
      }
      #program .section-shell button.program-row:hover::after {
        scale: 1.25;
      }
      /* Sessions open; the plain rows do not. Weight and colour say so
         before the cursor gets there. */
      #program .section-shell button.program-row .program-row__title {
        font-weight: 600;
        color: var(--brand-blue-dark);
      }
      #program .section-shell button.program-row:hover {
        background: var(--panel-surface-hover);
      }
      /* One tag column: a spacer stands in for the missing chevron on
         plain rows so every tag shares a right edge. */
      .program-row__meta .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 94px;
      }
      .program-row--plain .program-row__meta::after {
        content: "";
        width: 30px;
      }
      /* Chevron: the +/- glyph becomes a badge whose vertical bar
         retracts along its own axis, so open/closed is a morph. */
      .program-row__meta > span[aria-hidden="true"] {
        position: relative;
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--line-mid);
        background: var(--panel-surface-hover);
        font-size: 0;
        transition:
          background var(--dur-2) var(--ease-standard),
          border-color var(--dur-2) var(--ease-standard);
      }
      .program-row__meta > span[aria-hidden="true"] > .sc-interp {
        display: none;
      }
      .program-row__meta > span[aria-hidden="true"]::before,
      .program-row__meta > span[aria-hidden="true"]::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 11px;
        height: 1.6px;
        border-radius: 2px;
        background: var(--chev-ink);
        translate: -50% -50%;
        transition:
          transform var(--dur-3) var(--ease-emphasis),
          background var(--dur-2) var(--ease-standard);
      }
      .program-row__meta > span[aria-hidden="true"]::after {
        transform: rotate(90deg);
      }
      .program-row[aria-expanded="true"] .program-row__meta > span[aria-hidden="true"] {
        background: var(--chev-fill);
        border-color: var(--chev-fill);
      }
      .program-row[aria-expanded="true"] .program-row__meta > span[aria-hidden="true"]::before,
      .program-row[aria-expanded="true"] .program-row__meta > span[aria-hidden="true"]::after {
        background: var(--chev-ink-on);
      }
      .program-row[aria-expanded="true"] .program-row__meta > span[aria-hidden="true"]::after {
        transform: rotate(90deg) scaleX(0);
      }
      button.program-row:hover .program-row__meta > span[aria-hidden="true"] {
        border-color: var(--chev-fill);
      }
      /* Panel: aligned to the title column so the disclosure reads as
         belonging to its row, and animated on mount.

         Entry transitions rather than a filled keyframe animation. Both
         can express the same fade-and-rise, but a keyframe animation that
         starts at opacity 0 leaves the panel invisible if it never gets to
         run; with @starting-style the declared state is the visible one
         and the hidden state is only ever a starting point. A disclosure
         panel must not be able to open onto nothing. */
      .program-panel {
        padding: 2px 18px 30px 112px !important;
        opacity: 1;
        translate: none;
        transition:
          opacity var(--dur-3) var(--ease-entrance),
          translate var(--dur-4) var(--ease-entrance);
      }
      @starting-style {
        .program-panel {
          opacity: 0;
          translate: 0 -10px;
        }
      }
      .program-panel .track-card {
        opacity: 1;
        transition:
          opacity var(--dur-4) var(--ease-entrance) var(--card-in-delay, 0ms),
          translate var(--dur-3) var(--ease-emphasis),
          box-shadow var(--dur-3) var(--ease-standard),
          border-color var(--dur-3) var(--ease-standard);
      }
      .program-panel .track-card:nth-child(2) {
        --card-in-delay: 80ms;
      }
      .program-panel .track-card:nth-child(3) {
        --card-in-delay: 160ms;
      }
      .program-panel .track-card:nth-child(n + 4) {
        --card-in-delay: 220ms;
      }
      @starting-style {
        .program-panel .track-card {
          opacity: 0;
          translate: 0 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .program-panel,
        .program-panel .track-card {
          transition: none !important;
        }
      }
      @media (max-width: 880px) {
        /* No gutter to draw a rail in once the grid collapses. */
        #program .section-shell > .program-item::before,
        #program .section-shell .program-row::after {
          display: none;
        }
        #program .section-shell .program-row {
          gap: 4px 14px !important;
          padding: 14px !important;
        }
        .program-row__time {
          text-align: left;
        }
        .program-panel {
          padding-left: 14px !important;
        }
      }

      /* --- Theme cards ----------------------------------------------------
         The template forced all four numerals to brand blue, which threw
         away the only per-theme signal the cards carried. Mixing each
         theme colour toward ink keeps the hue and clears large-text
         contrast, which is what the blanket override was avoiding. */
      .theme-card > div:first-child {
        color: color-mix(in srgb, var(--theme-color, var(--brand-blue-dark)) 62%, #16232e) !important;
        font-size: 32px;
        letter-spacing: -.02em;
        font-variant-numeric: tabular-nums;
      }
      .theme-card {
        position: relative;
        overflow: hidden;
      }
      .theme-card::before {
        content: "";
        position: absolute;
        inset: -30% 55% 45% -20%;
        pointer-events: none;
        background: radial-gradient(closest-side, var(--theme-color, transparent), transparent);
        opacity: .1;
      }
      @media (min-width: 881px) {
        /* Two of the four titles run to a second line; reserving it keeps
           all four body paragraphs on one baseline. */
        .theme-card h3 {
          min-height: 2.4em;
        }
      }

      /* --- Speaker cards --------------------------------------------------
         Role tags floated wherever the bio ended, so a row of cards had
         four different tag heights. */
      .speaker-card {
        align-items: stretch !important;
      }
      .speaker-card__content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .speaker-card__content > .tag {
        margin-top: auto;
      }
      .speaker-card__content > p:last-of-type {
        margin-bottom: 14px !important;
      }
      .speaker-card__avatar {
        /* stretch is for the content column only — the avatar keeps its
           square box, or the initials sit in an ellipse. */
        align-self: flex-start;
        flex: none;
        background: var(--badge-tint) !important;
        box-shadow: inset 0 0 0 1px var(--line-soft);
      }

      /* --- Notes / Q&A / Gallery detail ---------------------------------- */
      /* A 46px arrow glyph was doing the work of an icon; give it the
         frame it was implying. */
      #notes [style*="var(--color-accent-300)"] {
        display: grid;
        place-items: center;
        flex: none;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 30px !important;
        line-height: 1 !important;
        color: var(--stat-ink) !important;
        background: var(--badge-tint);
        box-shadow: inset 0 0 0 1px var(--line-soft);
      }
      /* Micro-labels across the lower sections now match .kicker instead
         of sitting in three different accent tints. */
      #notes [style*="var(--color-accent-700)"],
      #qa [style*="var(--color-accent-700)"],
      #gallery [style*="var(--color-accent-700)"] {
        color: var(--label-ink) !important;
        font-weight: 700;
        letter-spacing: .14em;
      }
      /* Undo an over-broad contrast fix: it was meant for the pale stat
         numerals but caught every interpolated string in a brandcard,
         turning ordinary body copy link-blue. */
      .brandcard .sc-interp {
        color: inherit;
      }
      .brandcard [style*="var(--color-accent-400)"],
      .brandcard [style*="var(--color-accent-300)"] {
        color: var(--stat-ink) !important;
      }
      .tally-method-grid [style*="var(--color-accent-400)"] {
        font-size: 30px !important;
        font-variant-numeric: tabular-nums;
      }
      .tally-method-grid > .brandcard {
        position: relative;
        overflow: hidden;
      }
      .tally-method-grid > .brandcard::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: var(--rule-accent);
        opacity: .8;
      }
      /* Status pips rendered as 7px squares. */
      #gallery [style*="height: 7px"],
      #qa [style*="height: 7px"],
      .live-banner [style*="height: 7px"] {
        border-radius: 50% !important;
      }
      /* Share-of-total bars: rounded, clipped, and grown from the left
         on mount rather than appearing at full width. */
      #gallery [style*="height: 4px"] {
        border-radius: 999px !important;
        overflow: hidden;
      }
      #gallery [style*="height: 4px"] > * {
        border-radius: 999px;
        transform-origin: left center;
        scale: 1 1;
        transition: scale var(--dur-5) var(--ease-emphasis);
      }
      @starting-style {
        #gallery [style*="height: 4px"] > * {
          scale: 0 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gallery [style*="height: 4px"] > * {
          transition: none !important;
        }
      }
      /* Gallery cards ended at ragged heights with their counts floating. */
      .gallery-grid > .brandcard {
        display: flex;
        flex-direction: column;
      }
      .gallery-grid > .brandcard > *:last-child {
        margin-top: auto;
      }
      /* The Slido mirror header was a four-item nowrap row at every width
         above 600px, so the title wrapped while the meta stayed pinned. */
      .qa-layout > .brandcard > div:first-child {
        flex-wrap: wrap;
        row-gap: 8px;
      }
      .qa-layout > .brandcard > div:first-child > .tag {
        flex: none;
        white-space: nowrap;
      }
      #qa [style*="grid-template-columns: 48px 1fr"] > div:first-child {
        border-radius: 12px !important;
        border-color: var(--line-soft) !important;
        background: var(--color-accent-100) !important;
      }
      #qa [style*="font-size: 40px"] {
        color: var(--brand-blue-dark) !important;
        letter-spacing: -.01em !important;
      }

      /* ==================================================================
         Footer — it was the one region still on the pre-redesign grid:
         a hard 1180px centre against the page's fluid shell, dimmed by
         inline opacity, with none of the motifs the sections carry.
         ================================================================== */
      .site-footer {
        background: var(--footer-surface) !important;
        isolation: isolate;
      }
      /* Same seam every section boundary uses, so the footer reads as the
         last band of the page rather than a different document. */
      .site-footer::before {
        content: "";
        position: absolute;
        z-index: 2;
        top: 0;
        left: 50%;
        translate: -50% 0;
        width: min(var(--shell), calc(100% - 40px));
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(120,190,240,.5) 18%,
          var(--brand-yellow) 52%,
          #c3435d 82%,
          transparent
        );
      }
      /* Edge butterfly at the same weight as the section marks, bleeding
         off the corner per ASSET_NOTES. */
      .site-footer::after {
        content: "";
        position: absolute;
        z-index: 0;
        pointer-events: none;
        right: clamp(-70px, -4vw, -30px);
        bottom: -30px;
        width: clamp(150px, 17vw, 250px);
        aspect-ratio: 255/285;
        background: url("../assets/butterfly-mark.svg") center/contain no-repeat;
        opacity: .09;
        rotate: -12deg;
      }
      .site-footer > .halftone-y {
        top: -22px !important;
        right: clamp(24px, 6vw, 96px) !important;
        opacity: .4 !important;
      }
      /* Align to the shell the header, hero and every section use. */
      .site-footer .sec-inner,
      .site-footer > div:last-child > div {
        width: min(100% - 48px, var(--shell)) !important;
        max-width: none !important;
        margin-inline: auto !important;
      }
      .site-footer .sec-inner[style*="grid-template-columns"] {
        grid-template-columns: minmax(0, 1.45fr) minmax(0, .8fr) minmax(0, 1.05fr) !important;
        gap: clamp(28px, 4vw, 64px) !important;
        padding: clamp(50px, 5.6vw, 72px) 24px 40px !important;
      }
      .site-footer .sec-inner[style*="grid-template-columns"] > div:first-child > div:first-child {
        font-size: clamp(29px, 2.9vw, 38px) !important;
        letter-spacing: -.02em !important;
      }
      /* The dateline gets the same accent rule as a section header. */
      .site-footer .sec-inner[style*="grid-template-columns"] > div:first-child > div:nth-child(2) {
        position: relative;
        padding-bottom: 18px;
        margin-bottom: 16px;
        opacity: 1 !important;
        color: var(--footer-text) !important;
      }
      .site-footer .sec-inner[style*="grid-template-columns"] > div:first-child > div:nth-child(2)::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 64px;
        height: 3px;
        border-radius: 3px;
        background: var(--rule-accent);
      }
      /* Inline opacity dimmed text unpredictably against a gradient; state
         the colour instead and keep contrast checkable. */
      .site-footer p,
      .site-footer .sec-inner div,
      .site-footer .sec-inner span {
        opacity: 1 !important;
      }
      .site-footer p {
        color: var(--footer-text) !important;
        max-width: 42ch;
      }
      .site-footer [style*="text-transform: uppercase"] {
        color: var(--footer-label) !important;
        font-weight: 700 !important;
        letter-spacing: .16em !important;
      }
      /* Nav column: 44px targets kept, but with a marker that extends on
         hover so the links behave like links. */
      .site-footer .sec-inner[style*="grid-template-columns"] > div:nth-child(2) > div:last-child {
        gap: 0 !important;
      }
      .site-footer a[href^="#"] {
        position: relative;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        line-height: 1.4;
        padding-left: 16px;
        color: rgba(255,255,255,.9) !important;
        text-decoration: none;
        transition:
          color var(--dur-2) var(--ease-standard),
          padding-left var(--dur-2) var(--ease-standard);
      }
      .site-footer a[href^="#"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 7px;
        height: 1.5px;
        translate: 0 -50%;
        background: var(--brand-yellow);
        transition:
          width var(--dur-2) var(--ease-standard),
          background var(--dur-2) var(--ease-standard);
      }
      .site-footer a[href^="#"]:hover {
        color: #fff !important;
        padding-left: 23px;
      }
      .site-footer a[href^="#"]:hover::before {
        width: 14px;
        background: var(--footer-label);
      }
      .site-footer a[href^="mailto"] {
        color: #fff !important;
        font-weight: 600;
        text-decoration: underline;
        text-decoration-color: rgba(255,198,92,.75);
        text-underline-offset: 4px;
        transition: text-decoration-color var(--dur-2) var(--ease-standard);
      }
      .site-footer a[href^="mailto"]:hover {
        text-decoration-color: var(--footer-label);
      }
      /* Partner lockup: larger marks, undimmed, with a rule separating the
         wordmark-only partner from the two logos. */
      .site-footer .sec-inner:not([style*="grid-template-columns"]) {
        padding: 0 24px 34px !important;
      }
      .site-footer .sec-inner:not([style*="grid-template-columns"]) > div {
        gap: clamp(18px, 2.4vw, 34px) !important;
        padding-top: 30px !important;
        border-top: 1px solid var(--footer-line) !important;
        flex-wrap: wrap;
      }
      .site-footer .sec-inner:not([style*="grid-template-columns"]) img {
        opacity: 1 !important;
        height: 60px !important;
      }
      .site-footer .sec-inner:not([style*="grid-template-columns"]) img + img {
        height: 48px !important;
      }
      .site-footer .sec-inner:not([style*="grid-template-columns"]) > div > span:last-child {
        align-self: center;
        padding-left: clamp(14px, 1.6vw, 24px);
        border-left: 1px solid rgba(255,255,255,.22);
        font-size: 17px !important;
        letter-spacing: .1em !important;
        color: #fff !important;
      }
      /* Legal strip reads as its own band. */
      .site-footer > div:last-child {
        position: relative;
        z-index: 1;
        background: var(--footer-bar);
        border-top: 1px solid var(--footer-line) !important;
      }
      .site-footer > div:last-child > div {
        flex-wrap: wrap;
        gap: 8px 21px !important;
        padding: 16px 24px !important;
        font-size: 12px !important;
        color: rgba(255,255,255,.78) !important;
        opacity: 1 !important;
      }
      .site-footer > div:last-child > div > span:first-child {
        font-weight: 600;
        color: rgba(255,255,255,.92);
      }
      .site-footer > div:last-child > div > span + span {
        position: relative;
        padding-left: 22px;
      }
      .site-footer > div:last-child > div > span + span::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 1px;
        height: 12px;
        translate: 0 -50%;
        background: rgba(255,255,255,.28);
      }
      /* Restated after the grid override above, which would otherwise
         out-order the template's single-column mobile rule. */
      @media (max-width: 880px) {
        .site-footer .sec-inner[style*="grid-template-columns"] {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
          gap: 32px !important;
        }
        .site-footer .sec-inner[style*="grid-template-columns"] > div:first-child {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 600px) {
        .site-footer .sec-inner[style*="grid-template-columns"] {
          grid-template-columns: minmax(0, 1fr) !important;
          gap: 30px !important;
        }
        .site-footer::after {
          opacity: .06;
        }
        /* Both of these separate two items on one line. Once the rows wrap
           they lead a line instead of dividing one, so they come off. */
        .site-footer .sec-inner:not([style*="grid-template-columns"]) > div > span:last-child,
        .site-footer > div:last-child > div > span + span {
          padding-left: 0;
          border-left: 0;
        }
        .site-footer > div:last-child > div > span + span::before {
          display: none;
        }
      }

        });

          [{ opacity: 1 }, { opacity: 1 }],

        );

        renderMasterTimeline = () => {
          if (!masterAnimation || token !== cycleToken) return;
          const currentTime = Math.max(0, Number(masterAnimation.currentTime) || 0);
          if (currentTime < config.thinkingMs) {
            if (stage.dataset.thinkingState !== 'thinking') setState('thinking');
            const wordIndex = Math.min(
              config.sequence.length - 1,
              Math.floor(currentTime / wordDuration)

              renderedWordIndex = wordIndex;

              stage.style.setProperty(
                '--thinking-word-color',
                config.sequence[wordIndex].color

            const opacity = wordProgress < .24
              ? wordProgress / .24

              'translateY(' + ((wordProgress < .24 ? .12 * (1 - wordProgress / .24) :

            wordNode.style.transform = '';
            wordNode.style.filter = '';

          // to masterAnimation once (lockSvgToMaster) and advances on the
          // compositor from there, so it stays smooth even when this callback

      const restartSequence = (previousMode = mode) => {
        clearCycleTimers();
        const requestToken = ++sequenceRequestToken;

          resetTypedText();
          setState('thinking');
          wordNode.textContent = 'Preparing visual identity...';
          inlineTransformationLogo().then(() => {
            if (requestToken !== sequenceRequestToken || mode !== 'ultra' ||

      };
      const applyMode = nextMode => {
        if (!modes[nextMode]) nextMode = 'instant';
        const previousMode = mode;
        clearFieldExit();
        if (previousMode === 'ultra' && nextMode !== 'ultra') {
          butterflyField.classList.add('is-exiting');
          fieldExitTimer = window.setTimeout(() => {
            butterflyField.classList.remove('is-exiting');

          }, 700);
        }
        mode = nextMode;
        hero.dataset.thinkingMode = mode;
        document.documentElement.dataset.thinkingMode = mode;
        document.dispatchEvent(new CustomEvent('forum-thinking-mode-change', {
          detail: { mode: mode }
        }));
        updateModeCopy();
        syncModeInputs();
        scheduleModeInputSync();
        if (reducedMotion.matches && mode === 'ultra') {
          syncSvgTime(svgDurationMs);
        }
        if (mode !== 'ultra' && previousMode === 'ultra') {
          cancelSvgAnimationCollection();
          hero.classList.remove('is-revealing');
          hero.classList.remove('is-ultra-logo-reveal');
        }
        return previousMode;
      };

      // `close` is false for `change`, which is what arrow keys fire. Closing
      // the disclosure there made the group unusable by keyboard: the first
      // arrow press committed a mode and threw focus back to the summary, so a
      // user could never arrow across the options to compare them. Mouse users
      // never saw it, since a pointer also fires `click`.
      const closeMobileOverlaysBeforePlayback = callback => {
        const mobileLayout = window.matchMedia('(max-width: 880px)').matches;
        const primaryNav = document.querySelector('#primary-navigation');
        const menuButton = document.querySelector('.mobile-menu-button');
        const currentModeControl = getModeControl();
        if (!mobileLayout) return false;
        const modeWasOpen = currentModeControl?.open;
        const navigationWasOpen = primaryNav?.classList.contains('is-open');
        if (!modeWasOpen && !navigationWasOpen) return false;

        // Mobile uses separate navigation and Thinking Mode sheets. Dismiss
        // either one before playback and wait through the layout commit so the
        // first transformation frame is never hidden by interface chrome.
        if (currentModeControl) currentModeControl.open = false;
        if (navigationWasOpen && menuButton) menuButton.click();
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(callback);
        });
        return true;
      };
      const selectMode = (nextMode, { close = true, replay = false } = {}) => {
        if (!modes[nextMode]) return;
        const changed = nextMode !== mode;
        let previousMode = mode;
        if (changed) {
          writeStore(MODE_KEY, nextMode);
          previousMode = applyMode(nextMode);
        }
        const startSelectedMode = () => {
          if (changed || replay) restartSequence(previousMode);
        };
        if (close && closeMobileOverlaysBeforePlayback(startSelectedMode)) return;
        if (changed || replay) {
          restartSequence(previousMode);
        }
        scheduleModeInputSync();
        if (!close) return;
        const currentModeControl = getModeControl();
        if (currentModeControl) currentModeControl.open = false;
        currentModeControl?.querySelector('summary')?.focus({ preventScroll: true });
      };

      // Clicking the visible option label can synthesize the associated input
      // click with `detail === 0`, just like a keyboard activation. Remember
      // the pointerdown target so a pointer can replay an already-selected
      // mode without changing the keyboard behavior.
      let pointerModeInput = null;
      document.addEventListener('pointerdown', event => {
        const currentModeControl = getModeControl();
        if (!currentModeControl?.contains(event.target)) return;
        const label = event.target?.closest?.('label');
        pointerModeInput = label?.querySelector('input[name="thinking-mode"]') || null;
        // On mobile the dimmed area is a ::before backdrop owned by <details>;
        // pointer events on that pseudo-element target the owner itself.
        if (event.target !== currentModeControl || !currentModeControl.open) return;
        event.preventDefault();
        currentModeControl.open = false;
        currentModeControl.querySelector('summary')?.focus({ preventScroll: true });
      });
      document.addEventListener('pointercancel', event => {
        if (getModeControl()?.contains(event.target)) pointerModeInput = null;
      });
      // The renderer can replace the complete control after bootstrap. Keep
      // the behavior on document so a remounted input never loses its mode
      // transition, persistence, or keyboard handling.
      document.addEventListener('click', event => {
        const input = event.target?.closest?.('input[name="thinking-mode"]');
        const currentModeControl = getModeControl();
        // Chrome can expose a synthetic radio click as checked during capture

        // activated input's value is the choice; do not discard it based on
        // that transient property state.
        if (!input || !currentModeControl?.contains(input)) return;
        const pointerActivated = pointerModeInput === input;
        pointerModeInput = null;

        // detail === 0. Only a pointer should dismiss the panel — arrowing

      });

        const input = event.target?.closest?.('input[name="thinking-mode"]');

        const current = stage.dataset.thinkingState;

        if (mode === 'ultra') syncSvgTime(svgDurationMs);
      };
      document.addEventListener('pointerdown', event => {
        const mobileMastheadInteraction =
          window.matchMedia('(max-width: 880px)').matches &&
          event.target.closest('.site-header');

        // not intent to skip the hero sequence. In particular, never let the
        // close-menu tap collapse High or Ultra to their final frames.

        clearCycleTimers();

        cycleToken += 1;

          hero.classList.remove('is-ultra-logo-reveal');

        hero.classList.remove('is-ultra-logo-reveal');

    // Accessibility patches that need the DOM rather than CSS. Everything here
    // is idempotent — it runs once the bundle has assembled and again shortly
    // after, since a few regions render on a later tick.
    const applyA11yPatches = () => {

      // means rebuilding the node, so copy attributes and children across.
      document.querySelectorAll('#notes h4').forEach(h4 => {
        const h3 = document.createElement('h3');
        Array.from(h4.attributes).forEach(a => h3.setAttribute(a.name, a.value));

        h4.replaceWith(h3);
      });

      document.querySelectorAll('.program-heading__actions button:not([type])').forEach(button => {

      });

      // target is not focusable — Chrome papers over it via sequential-focus

      const mainContent = document.querySelector('#main-content');
      if (mainContent && !mainContent.hasAttribute('tabindex')) {

      }

      // exists in the DOM while expanded, so a collapsed row references a
      // missing id. Keep the attribute only while it resolves.
      document.querySelectorAll('.program-row[aria-controls]').forEach(row => {
        const id = row.getAttribute('aria-controls');
        if (id && !document.getElementById(id)) {
          row.dataset.ariaControls = id;
          row.removeAttribute('aria-controls');
        }
      });
      document.querySelectorAll('.program-row[data-aria-controls]').forEach(row => {
        const id = row.dataset.ariaControls;
        if (document.getElementById(id)) row.setAttribute('aria-controls', id);
      });

      // more than one landmark. Each already carries exactly one h2.
      document.querySelectorAll('main section:not([aria-label]):not([aria-labelledby])').forEach(section => {
        const heading = section.querySelector('h2');

      // aria-pressed flips, focus stays put, and the change is silent. One
      // shared status region covers the chips and the Q&A room selector.
      let status = document.querySelector('#forum-status-region');
      if (!status) {
        status = document.createElement('div');
        status.id = 'forum-status-region';
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        status.className = 'sr-only';
        status.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;';

      }

        // Re-setting identical text does not re-announce; clear first.
        status.textContent = '';
        window.setTimeout(() => { status.textContent = message; }, 60);
      };
      document.querySelectorAll('.filter-chip:not([data-announce-wired])').forEach(chip => {
        chip.dataset.announceWired = '1';
        chip.addEventListener('click', () => {
          window.setTimeout(() => {
            const shown = document.querySelectorAll('.speaker-card').length;
            announce(shown + ' resource ' + (shown === 1 ? 'person' : 'people') + ' shown for ' + chip.textContent.trim() + '.');

    };

    /* ------------------------------------------------------------------
       Scroll choreography.

       The bundle revealed one whole <section> per intersection, and only
       under `(min-width: 900px) and (hover: hover)`, so a phone got no
       motion at all and a laptop got six 560ms slabs. This reveals the
       individual cards, rows and footer columns instead, at every width.

       Element animations rather than a CSS class: the app re-applies

       add. Each element's animation is created immediately and paused —
       `fill: 'both'` means a paused animation holds the from-keyframe, so
       nothing flashes before its turn — then played when the element
       intersects. On finish it is cancelled, because a filled transform
       would otherwise sit permanently on top of the cards' hover lift.
       ------------------------------------------------------------------ */
    const REVEAL_SELECTOR = [
      'main section:not(.hero) .section-shell > div[style*="align-items: flex-end"]',
      'main section:not(.hero) .section-shell > p',
      'main section:not(.hero) .section-shell > article',
      'main section:not(.hero) .section-shell > .brandcard',
      '.filter-group',
      '.program-item',
      '.theme-card',
      '.speaker-card',
      '.tally-method-grid > *',
      '.gallery-grid > *',
      '.qa-layout > *',
      '.site-footer .sec-inner > div',
      '.site-footer > div:last-child > div'
    ].join(',');

    const initScrollChoreography = () => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true;
      if (typeof Element === 'undefined' || !Element.prototype.animate) return true;
      if (typeof IntersectionObserver === 'undefined') return true;

      const holds = new WeakMap();
      let pending = [];
      let enabled = document.documentElement.dataset.thinkingMode !== 'instant';

      const play = (el, extraDelay) => {
        const animation = holds.get(el);
        if (!animation) return;
        holds.delete(el);
        pending = pending.filter(node => node !== el);
        if (extraDelay > 0) {
          // Preferred over setTimeout: the delay is part of the effect, so
          // the from-keyframe keeps holding and there is no untimed frame.
          try {
            animation.effect.updateTiming({ delay: extraDelay });
          } catch (error) {
            window.setTimeout(() => animation.play(), extraDelay);
            return;
          }
        }
        animation.play();
      };

      const hold = el => {
        if (holds.has(el) || el.dataset.revealed === '1') return false;
        el.dataset.revealed = '1';
        const distance = el.closest('.site-footer') ? 14 : 20;
        const animation = el.animate([
          { opacity: 0, transform: 'translate3d(0,' + distance + 'px,0)' },
          { opacity: 1, transform: 'none' }
        ], { duration: 620, easing: 'cubic-bezier(.16,.84,.24,1)', fill: 'both' });
        animation.pause();
        animation.onfinish = () => {
          try { animation.cancel(); } catch (error) { /* already gone */ }
        };
        holds.set(el, animation);
        pending.push(el);
        return true;
      };

      const showWithoutMotion = (el, remember = true) => {
        const animation = holds.get(el);
        if (animation) {
          try { animation.cancel(); } catch (error) { /* already gone */ }
          holds.delete(el);
        }
        pending = pending.filter(node => node !== el);
        if (remember) el.dataset.revealed = '1';
        else delete el.dataset.revealed;
      };

      // Staggering by list index would punish long lists — the 20th
      // program row would carry a 1.4s delay by the time it scrolled into
      // view. Batching by observer callback instead means the stagger only
      // ever separates elements that arrived on screen together.
      let observerFired = false;
      const observer = new IntersectionObserver(entries => {
        const arrived = entries.filter(entry => entry.isIntersecting);
        if (arrived.length) observerFired = true;
        arrived.sort((a, b) =>
          (a.boundingClientRect.top - b.boundingClientRect.top) ||
          (a.boundingClientRect.left - b.boundingClientRect.left));
        arrived.forEach((entry, index) => {
          observer.unobserve(entry.target);

      // De-nest: a .qa-layout child can also match the section-shell
      // brandcard rule, and animating both would double the fade.
      const scan = root => {
        const found = Array.from(root.querySelectorAll(REVEAL_SELECTOR));
        const kept = [];
        found.forEach(el => {
          if (kept.some(other => other.contains(el))) return;
          kept.push(el);

      const activate = () => {
        enabled = true;
        scan(document).forEach(el => {
          if (holds.has(el) || el.dataset.revealed === '1') return;
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight) {
            el.dataset.revealed = '1';
            return;

        enabled = false;
        pending.slice().forEach(el => {
          observer.unobserve(el);

          // still receive choreography if High or Ultra is selected later.

      const rescan = () => {
        rescanTimer = 0;
        if (!enabled) return;
        scan(document).forEach(el => {
          if (holds.has(el) || el.dataset.revealed === '1') return;
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight && rect.bottom > 0) {
            el.dataset.revealed = '1';
            return;
          }
          if (hold(el)) observer.observe(el);
        });
      };
      const mountObserver = new MutationObserver(() => {
        if (rescanTimer) return;
        rescanTimer = window.setTimeout(rescan, 120);
      });
      const main = document.querySelector('main');
      if (main) mountObserver.observe(main, { childList: true, subtree: true });

      // Failsafe for the case where the observer never reports at all — a
      // browser quirk, a zero-height ancestor. Gated on that, because
      // flushing the queue after a *working* first batch would reveal the
      // whole page off-screen and there would be nothing left to scroll to.
      window.setTimeout(() => {
        if (!enabled || observerFired) return;
        pending.slice().forEach(el => {
          observer.unobserve(el);
          play(el, 0);
        });
      }, 2600);

      return true;
    };

    let choreographyStarted = false;
    const startChoreographyWhenReady = () => {
      if (choreographyStarted) return true;
      if (!document.querySelector('main section:not(.hero) .section-shell')) return false;
      choreographyStarted = true;
      try {
        initScrollChoreography();
      } catch (error) {
        // Cosmetic layer: a failure here must not hide the page it reveals.
        console.warn('scroll choreography failed', error);
      }
      return true;
    };

    let heroThinkingStarted = false;
    let heroThinkingObserver;
    const startHeroThinkingWhenReady = () => {
      if (heroThinkingStarted) return true;
      if (!initHeroThinking()) return false;
      heroThinkingStarted = true;
      if (heroThinkingObserver && choreographyStarted) heroThinkingObserver.disconnect();
      try {
        applyA11yPatches();
        window.setTimeout(applyA11yPatches, 400);
        document.addEventListener('click', event => {
          if (event.target.closest && event.target.closest('.program-row')) {
            window.setTimeout(applyA11yPatches, 0);
          }
        });
      } catch (error) {
        // Never let a patch failure take the headline animation down with it.
        console.warn('a11y patches failed', error);
      }
      return true;
    };
    // Both hooks wait on the same document swap, so they share one observer;
    // it only lets go once neither is still waiting.
    const startPageBehaviour = () => {
      const choreography = startChoreographyWhenReady();
      const hero = startHeroThinkingWhenReady();
      if (choreography && hero && heroThinkingObserver) heroThinkingObserver.disconnect();
      return choreography && hero;
    };

    heroThinkingObserver.observe(document.documentElement, { childList: true, subtree: true });

    setTimeout(() => {
      if (!startPageBehaviour()) {

      }

    console.error('Bundle unpack error:', err);
  }

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>MEtamorphosis — 13th M&E Network Forum<\u002Ftitle>\n<script src=\"552fb0d4-4804-4778-80f6-b289eec38c3f\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\u002Fa>\n<x-dc>\n<helmet>\n<style>/* Industry — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"481eb948-fddb-40c3-88cc-b368c0b8df22\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n/* cyrillic */\n/* greek-ext */\n/* greek */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"01a1482e-b620-4e5b-b6f7-9eac48c1913b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n/* cyrillic */\n/* greek-ext */\n/* greek */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"01a1482e-b620-4e5b-b6f7-9eac48c1913b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n/* cyrillic */\n/* greek-ext */\n/* greek */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weig
